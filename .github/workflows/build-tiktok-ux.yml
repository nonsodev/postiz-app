name: "Build patched image (TikTok UX)"

# Builds this fork's Postiz image for the self-hosted VPS (amd64 only) and pushes
# it to ghcr.io/<owner>/postiz-app:<branch>. Same Dockerfile as upstream.
on:
  workflow_dispatch:
  push:
    branches:
      - tiktok-ux

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ghcr.io/$OWNER/postiz-app:v2.25.0-tiktok-ux \
            --build-arg NEXT_PUBLIC_VERSION=v2.25.0-tiktok-ux \
            --provenance=false --sbom=false \
            --push .
